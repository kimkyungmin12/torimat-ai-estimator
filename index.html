<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>토리매트 AI 자동견적</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#f4f5f2;color:#222}
.wrap{max-width:1180px;margin:0 auto;padding:24px}
h1{font-size:28px;margin:0 0 6px}
.sub{color:#666;margin-bottom:20px}
.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}
.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px}
.step{font-size:13px;font-weight:700;color:#35663e;margin-bottom:8px}
#pasteZone{min-height:145px;border:2px dashed #5b8661;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;background:#f7fbf7;cursor:text;outline:none}
#pasteZone:focus{box-shadow:0 0 0 4px rgba(61,111,73,.12)}
#preview{display:none;max-width:100%;max-height:620px;margin:14px auto 0;border-radius:8px;border:1px solid #ddd}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}
.primary{background:#3c6e47;color:#fff}
.secondary{background:#fff;border:1px solid #3c6e47;color:#2f5b38}
button:disabled{opacity:.5;cursor:not-allowed}
.status{font-size:13px;color:#666;margin-top:10px;white-space:pre-wrap}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
th,td{padding:8px 6px;border-bottom:1px solid #eee;text-align:left;vertical-align:middle}
input{width:100%;padding:8px;border:1px solid #ccc;border-radius:7px}
.result{margin-top:14px;padding:14px;background:#edf6ed;border:1px solid #cfe2cf;border-radius:10px}
.result strong{font-size:26px;color:#285331}
.small{font-size:12px;color:#777;line-height:1.5}
.warn{background:#fff7e8;border:1px solid #efd9a8;padding:10px;border-radius:9px;font-size:12px;color:#6f5a28;margin-top:12px}
.badge{display:inline-block;padding:3px 7px;border-radius:999px;font-size:11px;white-space:nowrap}
.source-direct{background:#e7f5e9;color:#246a33}
.source-derived{background:#e8f0fb;color:#2b5d9c}
.source-scale{background:#fff3d6;color:#8a6418}
.source-ai{background:#fde8e7;color:#9a3d35}
.conf-high{font-weight:700;color:#2f6b3a}
.conf-medium{font-weight:700;color:#8a6418}
.conf-low{font-weight:700;color:#a43c35}
.dim-candidates{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.dim-chip{font-size:11px;padding:5px 7px;border:1px solid #ddd;border-radius:999px;background:#fafafa}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>토리매트 AI 자동견적</h1>
  <div class="sub">도면 실제 치수 우선 → 계산 복원 → 비례추정 → 회사 계산식으로 80×80 장수 계산</div>

  <div class="grid">
    <div class="card">
      <div class="step">① 도면 넣기</div>
      <input id="fileInput" type="file" accept="image/*" hidden>
      <div id="pasteZone" tabindex="0" contenteditable="true">
        <div><b>여기를 클릭한 뒤 Ctrl+V</b><br><span class="small">또는 파일 선택</span></div>
      </div>
      <img id="preview" alt="도면 미리보기">

      <div class="row">
        <button id="chooseBtn" class="secondary" type="button">파일 선택</button>
        <button id="analyzeBtn" class="primary" type="button" disabled>② AI로 도면 분석</button>
      </div>

      <div id="status" class="status">도면을 넣어주세요.</div>

      <div id="allDimsBox" style="display:none;margin-top:14px;">
        <div class="step" style="margin-bottom:4px;">도면에서 읽힌 모든 치수</div>
        <div id="allDims" class="dim-candidates"></div>
      </div>

      <div class="warn">
        추정값은 노란색/빨간색으로 표시됩니다. 실제 표기값과 계산 복원값을 우선 사용하고,
        정말 근거가 부족한 경우에만 비례추정 또는 AI추정을 사용합니다.
      </div>
    </div>

    <div class="card">
      <div class="step">③ 시공 구간 치수 확인</div>

      <table>
        <thead>
          <tr>
            <th>구간</th>
            <th>가로 cm</th>
            <th>가로 근거</th>
            <th>세로 cm</th>
            <th>세로 근거</th>
            <th>50cm 칸</th>
          </tr>
        </thead>
        <tbody id="rooms"></tbody>
      </table>

      <div class="row">
        <button id="addBtn" class="secondary" type="button">구간 추가</button>
        <button id="calcBtn" class="primary" type="button">④ 80매트 계산</button>
      </div>

      <div id="result" class="result">
        <div>예상 장수</div>
        <strong>-</strong>
        <div id="basis" class="small"></div>
      </div>

      <div id="aiNotes" class="small" style="margin-top:12px"></div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let currentFile = null;
const defaultRooms = ["거실","복도","주방"];

const sourceMap = {
  "direct": ["도면표기","source-direct"],
  "derived": ["계산값","source-derived"],
  "scale": ["비례추정","source-scale"],
  "ai": ["AI추정","source-ai"],
  "manual": ["수정","source-derived"],
  "unknown": ["미확인","source-ai"]
};

function sourceBadge(source, confidence){
  const [label, cls] = sourceMap[source] || sourceMap.unknown;
  const c = confidence || "low";
  return `<span class="badge ${cls}" title="${c}">${label}</span><br><span class="small conf-${c}">${c}</span>`;
}

function addRoom(name="", width="", height="", widthSource="unknown", heightSource="unknown", widthConf="low", heightConf="low"){
  const tr = document.createElement("tr");
  tr.dataset.widthSource = widthSource;
  tr.dataset.heightSource = heightSource;
  tr.dataset.widthConf = widthConf;
  tr.dataset.heightConf = heightConf;

  tr.innerHTML = `
    <td><input class="name" value="${name}"></td>
    <td><input class="w" type="number" step="0.1" value="${width ?? ""}"></td>
    <td class="w-source">${sourceBadge(widthSource,widthConf)}</td>
    <td><input class="h" type="number" step="0.1" value="${height ?? ""}"></td>
    <td class="h-source">${sourceBadge(heightSource,heightConf)}</td>
    <td class="units">0</td>`;

  $("#rooms").appendChild(tr);

  const w = tr.querySelector(".w");
  const h = tr.querySelector(".h");

  w.addEventListener("input", ()=>{
    tr.dataset.widthSource="manual"; tr.dataset.widthConf="high";
    tr.querySelector(".w-source").innerHTML=sourceBadge("manual","high");
    refreshRow(tr);
  });
  h.addEventListener("input", ()=>{
    tr.dataset.heightSource="manual"; tr.dataset.heightConf="high";
    tr.querySelector(".h-source").innerHTML=sourceBadge("manual","high");
    refreshRow(tr);
  });

  refreshRow(tr);
}

function refreshRow(tr){
  const w = parseFloat(tr.querySelector(".w").value)||0;
  const h = parseFloat(tr.querySelector(".h").value)||0;
  tr.querySelector(".units").textContent = (w&&h) ? Math.ceil(w/50)*Math.ceil(h/50) : 0;
}

defaultRooms.forEach(n=>addRoom(n));

function showFile(file){
  if(!file || !file.type || !file.type.startsWith("image/")) return;
  currentFile = file;
  const url = URL.createObjectURL(file);
  const img = $("#preview");
  img.onload = ()=>URL.revokeObjectURL(url);
  img.src = url;
  img.style.display = "block";
  $("#analyzeBtn").disabled = false;
  $("#status").textContent = "도면 입력 완료 ✓";
  $("#pasteZone").innerHTML = "<div><b>도면 붙여넣기 완료 ✓</b><br><span class='small'>새 도면은 다시 클릭 후 Ctrl+V</span></div>";
}

$("#chooseBtn").onclick = ()=>$("#fileInput").click();
$("#fileInput").onchange = ()=>showFile($("#fileInput").files[0]);
$("#pasteZone").addEventListener("click", ()=>$("#pasteZone").focus());
$("#pasteZone").addEventListener("paste", e=>{
  const cd=e.clipboardData;
  let f=null;
  if(cd?.files){ for(const x of cd.files){ if((x.type||"").startsWith("image/")){f=x;break;} } }
  if(!f && cd?.items){ for(const i of cd.items){ if((i.type||"").startsWith("image/")){f=i.getAsFile(); if(f)break;} } }
  e.preventDefault(); e.stopPropagation();
  if(f) showFile(f);
  else $("#status").textContent="이미지 자체를 복사한 뒤 다시 Ctrl+V 해주세요.";
});

function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.onerror=reject;
    r.readAsDataURL(file);
  });
}

function renderAllDims(items){
  const box=$("#allDims"), wrap=$("#allDimsBox");
  box.innerHTML="";
  if(!items?.length){ wrap.style.display="none"; return; }
  for(const d of items){
    const span=document.createElement("span");
    span.className="dim-chip";
    span.textContent=`${d.value_mm}mm (${(d.value_mm/10).toFixed(1)}cm) · ${d.orientation||"?"}`;
    span.title=d.location||"";
    box.appendChild(span);
  }
  wrap.style.display="block";
}

$("#analyzeBtn").onclick = async ()=>{
  if(!currentFile) return;
  $("#analyzeBtn").disabled=true;
  $("#status").textContent="AI가 도면의 모든 치수선과 시공영역을 분석 중입니다...";

  try{
    const image=await fileToDataURL(currentFile);
    const r=await fetch("/api/analyze",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({image})
    });

    const text=await r.text();
    let data;
    try{ data=JSON.parse(text); }
    catch{ throw new Error("서버 응답 오류: "+text.slice(0,160)); }

    if(!r.ok) throw new Error(data.error||"분석 실패");

    renderAllDims(data.dimensions);

    $("#rooms").innerHTML="";
    const byName=new Map((data.rooms||[]).map(x=>[x.name,x]));

    for(const name of defaultRooms){
      const r=byName.get(name)||{};
      addRoom(
        name,
        r.width_cm ?? "",
        r.height_cm ?? "",
        r.width_source || "unknown",
        r.height_source || "unknown",
        r.width_confidence || "low",
        r.height_confidence || "low"
      );
    }

    for(const rr of (data.extra_regions||[])){
      addRoom(
        rr.name || "기타",
        rr.width_cm ?? "",
        rr.height_cm ?? "",
        rr.width_source || "unknown",
        rr.height_source || "unknown",
        rr.width_confidence || "low",
        rr.height_confidence || "low"
      );
    }

    $("#aiNotes").textContent = data.notes ? "AI 메모: "+data.notes : "";
    $("#status").textContent="분석 완료 ✓  노란색/빨간색 추정값만 우선 확인하세요.";
  }catch(e){
    $("#status").textContent="분석 실패: "+e.message;
  }finally{
    $("#analyzeBtn").disabled=false;
  }
};

$("#addBtn").onclick=()=>addRoom("기타");

$("#calcBtn").onclick=()=>{
  let total=0, valid=0, hasEstimate=false;

  for(const tr of $("#rooms").querySelectorAll("tr")){
    const w=parseFloat(tr.querySelector(".w").value)||0;
    const h=parseFloat(tr.querySelector(".h").value)||0;
    const units=(w&&h)?Math.ceil(w/50)*Math.ceil(h/50):0;
    tr.querySelector(".units").textContent=units;
    if(units){ total+=units; valid++; }

    if(["scale","ai"].includes(tr.dataset.widthSource) || ["scale","ai"].includes(tr.dataset.heightSource)){
      hasEstimate=true;
    }
  }

  if(!valid){
    $("#result strong").textContent="-";
    $("#basis").textContent="치수를 먼저 확인하세요.";
    return;
  }

  const mats=Math.floor(total/2.56);
  $("#result strong").textContent=mats+"장";
  $("#basis").textContent=
    `회사 계산식: 구간별 ceil(가로÷50) × ceil(세로÷50) 합계 ${total}칸 → floor(${total}÷2.56) = ${mats}장` +
    (hasEstimate ? " · 추정값 포함" : " · 추정값 없음");
};
</script>
</body>
</html>
