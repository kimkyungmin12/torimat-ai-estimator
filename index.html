<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>토리매트 AI 자동견적</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f4f5f2;color:#222}
.wrap{max-width:1100px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}
.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px}.step{font-weight:700;color:#35663e;margin-bottom:8px}
#pasteZone{min-height:150px;border:2px dashed #5b8661;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;background:#f7fbf7;cursor:text;outline:none}
#pasteZone:focus{box-shadow:0 0 0 4px rgba(61,111,73,.12)} #preview{display:none;max-width:100%;max-height:650px;margin-top:14px;border:1px solid #ddd;border-radius:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}
.primary{background:#3c6e47;color:#fff}.secondary{background:#fff;border:1px solid #3c6e47;color:#2f5b38}
table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:9px 7px;border-bottom:1px solid #eee;text-align:left}input{width:100%;padding:8px;border:1px solid #ccc;border-radius:7px}
.result{margin-top:14px;padding:14px;background:#edf6ed;border:1px solid #cfe2cf;border-radius:10px}.result strong{font-size:26px;color:#285331}
.small,.status{font-size:12px;color:#666;line-height:1.5}.warn{background:#fff7e8;border:1px solid #efd9a8;padding:10px;border-radius:9px;font-size:12px;color:#6f5a28;margin-top:12px}
@media(max-width:850px){.grid{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap">
<h1>토리매트 AI 자동견적</h1>
<div class="small" style="margin-bottom:18px">도면 → AI 치수 분석 → 확인/수정 → 회사 계산식으로 80×80 매트 장수 계산</div>
<div class="grid">
<div class="card">
<div class="step">① 도면 넣기</div>
<input id="fileInput" type="file" accept="image/*" hidden>
<div id="pasteZone" tabindex="0" contenteditable="true"><div><b>여기를 클릭한 뒤 Ctrl+V</b><br><span class="small">클릭해도 파일선택창이 뜨지 않습니다.</span></div></div>
<img id="preview">
<div class="row"><button id="chooseBtn" class="secondary">파일 선택</button><button id="analyzeBtn" class="primary" disabled>② AI로 도면 분석</button></div>
<div id="status" class="status">도면을 붙여넣거나 파일을 선택해주세요.</div>
<div class="warn">AI가 읽은 치수는 계산 전에 한 번 확인하세요.</div>
</div>
<div class="card">
<div class="step">③ 거실 · 복도 · 주방 치수 확인</div>
<table><thead><tr><th>구간</th><th>가로 cm</th><th>세로 cm</th><th>50cm 칸</th></tr></thead><tbody id="rooms"></tbody></table>
<div class="row"><button id="addBtn" class="secondary">구간 추가</button><button id="calcBtn" class="primary">④ 80매트 계산</button></div>
<div class="result"><div>예상 장수</div><strong id="mats">-</strong><div id="basis" class="small"></div></div>
<div id="aiNotes" class="small" style="margin-top:12px"></div>
</div></div></div>
<script>
const $=s=>document.querySelector(s); let currentFile=null; const defaults=["거실","복도","주방"];
function addRoom(name="",w="",h=""){const tr=document.createElement("tr");tr.innerHTML=`<td><input class="name" value="${name}"></td><td><input class="w" type="number" step="0.1" value="${w??""}"></td><td><input class="h" type="number" step="0.1" value="${h??""}"></td><td class="units">0</td>`;$("#rooms").appendChild(tr);tr.querySelectorAll("input").forEach(x=>x.addEventListener("input",()=>refresh(tr)));refresh(tr)}
function refresh(tr){const w=parseFloat(tr.querySelector(".w").value)||0,h=parseFloat(tr.querySelector(".h").value)||0;tr.querySelector(".units").textContent=w&&h?Math.ceil(w/50)*Math.ceil(h/50):0}
defaults.forEach(addRoom);
function showFile(file){if(!file||!file.type.startsWith("image/"))return;currentFile=file;const u=URL.createObjectURL(file),img=$("#preview");img.onload=()=>URL.revokeObjectURL(u);img.src=u;img.style.display="block";$("#analyzeBtn").disabled=false;$("#status").textContent="도면 입력 완료 ✓";$("#pasteZone").innerHTML="<div><b>도면 붙여넣기 완료 ✓</b><br><span class='small'>새 도면은 다시 클릭 후 Ctrl+V</span></div>"}
$("#chooseBtn").onclick=()=>$("#fileInput").click(); $("#fileInput").onchange=()=>showFile($("#fileInput").files[0]);
$("#pasteZone").addEventListener("click",()=>$("#pasteZone").focus());
$("#pasteZone").addEventListener("paste",e=>{let f=null;const cd=e.clipboardData;if(cd?.files){for(const x of cd.files){if(x.type.startsWith("image/")){f=x;break}}}if(!f&&cd?.items){for(const i of cd.items){if(i.type.startsWith("image/")){f=i.getAsFile();if(f)break}}}e.preventDefault();e.stopPropagation();if(f)showFile(f);else $("#status").textContent="이미지 자체를 복사한 뒤 다시 Ctrl+V 해주세요."});
["dragover","dragenter"].forEach(t=>$("#pasteZone").addEventListener(t,e=>e.preventDefault()));$("#pasteZone").addEventListener("drop",e=>{e.preventDefault();showFile(e.dataTransfer.files[0])});
function toDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
$("#analyzeBtn").onclick=async()=>{if(!currentFile)return;$("#analyzeBtn").disabled=true;$("#status").textContent="AI 분석 중...";try{const image=await toDataURL(currentFile);const r=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image})});const data=await r.json();if(!r.ok)throw new Error(data.error||"분석 실패");$("#rooms").innerHTML="";const m=new Map((data.rooms||[]).map(x=>[x.name,x]));for(const n of defaults){const x=m.get(n);addRoom(n,x?.width_cm??"",x?.height_cm??"")}$("#aiNotes").textContent=data.notes?"AI 메모: "+data.notes:"";$("#status").textContent="분석 완료 ✓"}catch(e){$("#status").textContent="분석 실패: "+e.message}finally{$("#analyzeBtn").disabled=false}};
$("#addBtn").onclick=()=>addRoom("기타");
$("#calcBtn").onclick=()=>{let total=0;$("#rooms").querySelectorAll("tr").forEach(tr=>{const w=parseFloat(tr.querySelector(".w").value)||0,h=parseFloat(tr.querySelector(".h").value)||0,u=w&&h?Math.ceil(w/50)*Math.ceil(h/50):0;tr.querySelector(".units").textContent=u;total+=u});const mats=Math.floor(total/2.56);$("#mats").textContent=total?mats+"장":"-";$("#basis").textContent=total?`회사 계산식: 총 ${total}칸 → floor(${total}÷2.56) = ${mats}장`:"치수를 먼저 확인하세요."}
</script></body></html>
